<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>โปรแกรมหารบิล (วาระแห่งชาติ)</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px 8px;
            line-height: 1.5;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px 15px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }

        h1 {
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 20px;
            color: #0f172a;
        }

        .section {
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .section:last-of-type {
            border-bottom: none;
            padding-bottom: 0;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            gap: 6px;
        }

        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: #fee2e2; color: var(--danger-color); }
        .btn-danger:hover { background-color: var(--danger-color); color: white; }
        .btn-small { padding: 5px 10px; font-size: 0.8rem; border-radius: 6px; }
        .btn-secondary { background-color: #e2e8f0; color: #475569; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; }
        .btn-secondary:hover { background-color: #cbd5e1; }

        .row-item {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        input[type="text"], input[type="number"] {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            color: var(--text-main);
            width: 100%;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--primary-color);
        }

        .item-block {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
        }

        /* โครงสร้างหลักของกรอกข้อมูลอาหาร */
        .item-inputs-layout {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .inputs-row-top {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .inputs-row-bottom {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .field-group.flex-2 {
            flex: 2;
        }

        .field-label-mini {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .sharers-zone {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
        }

        .sharers-header {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        @media (min-width: 480px) {
            .sharers-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .sharers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 6px;
        }

        .sharer-input-group {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            padding: 4px 6px;
            border-radius: 6px;
            gap: 4px;
        }

        .sharer-name {
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .input-weight {
            width: 50px !important;
            padding: 4px !important;
            text-align: center;
            font-size: 0.8rem !important;
            border-radius: 4px !important;
            height: 28px;
        }

        .bill-modifiers {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .modifier-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .modifier-field label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .summary-card {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 14px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .summary-row.total-row {
            font-size: 1.1rem;
            font-weight: 700;
            border-top: 1px solid #cbd5e1;
            padding-top: 8px;
            margin-top: 8px;
            color: #0f172a;
        }

        .result-person-block {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.05);
        }

        .result-person-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: #f0fdf4;
            border-left: 5px solid var(--success-color);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .result-person-total {
            font-size: 1.05rem;
            color: #15803d;
            font-weight: 700;
        }

        .result-person-details {
            padding: 10px 14px;
            background: #fafafa;
        }

        .detail-item-row {
            display: flex;
            flex-direction: column;
            padding: 6px 0;
            border-bottom: 1px dashed #e2e8f0;
            gap: 2px;
        }

        @media (min-width: 400px) {
            .detail-item-row {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .detail-item-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-item-name {
            font-size: 0.85rem;
            color: #475569;
        }

        .detail-item-share {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .detail-item-price {
            font-size: 0.85rem;
            font-weight: 600;
            color: #1e293b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💸 นี่คือวาระแห่งชาติ!</h1>

    <div class="section">
        <div class="section-title">
            <span>สมาชิกตี้ ได้แก่</span>
            <button class="btn btn-primary btn-small" onclick="addPerson()">+ เพิ่มคน</button>
        </div>
        <div id="people-container">
            </div>
    </div>

    <div class="section">
        <div class="section-title">
            <span>รายการอาหาร และสัดส่วนคนกิน</span>
            <button class="btn btn-primary btn-small" onclick="addItem()">+ เพิ่มรายการอาหาร</button>
        </div>
        <div id="items-container">
            </div>
    </div>

    <div class="section">
        <div class="section-title">ส่วนลดและค่าบริการเพิ่มเติมท้ายบิล</div>
        <div class="bill-modifiers">
            <div class="modifier-field">
                <label for="bill-discount">ส่วนลด (บาท)</label>
                <input type="number" id="bill-discount" value="0" min="0" oninput="calculateBill()">
            </div>
            <div class="modifier-field">
                <label for="bill-service-charge">Svc (%)</label>
                <input type="number" id="bill-service-charge" value="0" min="0" oninput="calculateBill()">
            </div>
            <div class="modifier-field">
                <label for="bill-vat">VAT (%)</label>
                <input type="number" id="bill-vat" value="7" min="0" oninput="calculateBill()">
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-row">
                <span>ยอดรวมค่าอาหารดิบทั้งหมด:</span>
                <span><span id="sum-subtotal">0.00</span> บาท</span>
            </div>
            <div class="summary-row">
                <span>หักส่วนลดบิล:</span>
                <span>- <span id="sum-discount">0.00</span> บาท</span>
            </div>
            <div class="summary-row">
                <span>Service Charge:</span>
                <span>+ <span id="sum-service">0.00</span> บาท</span>
            </div>
            <div class="summary-row">
                <span>ภาษีมูลค่าเพิ่ม (VAT):</span>
                <span>+ <span id="sum-vat">0.00</span> บาท</span>
            </div>
            <div class="summary-row total-row">
                <span>ยอดรวมสุทธิทั้งบิล:</span>
                <span><span id="sum-grand-total">0.00</span> บาท</span>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">สรุปยอดสุทธิและรายการของแต่ละคน</div>
        <div id="results-container">
            </div>
    </div>
</div>

<script>
    let people = [
        { id: 'p1', name: 'นาย A' },
        { id: 'p2', name: 'นาย B' },
        { id: 'p3', name: 'นาย C' }
    ];

    let items = [
        { 
            id: 'i1', 
            name: 'รายการจานกลาง (กินเท่ากัน)', 
            qty: 1, 
            price: 300, 
            weights: { 'p1': 1, 'p2': 1, 'p3': 1 } 
        }
    ];

    let personCounter = 3;
    let itemCounter = 1;

    window.onload = function() {
        renderPeople();
        renderItems();
        calculateBill();
    };

    function renderPeople() {
        const container = document.getElementById('people-container');
        container.innerHTML = '';
        
        people.forEach((person) => {
            const div = document.createElement('div');
            div.className = 'row-item';
            div.innerHTML = `
                <input type="text" style="flex:1;" value="${person.name}" oninput="updatePersonName('${person.id}', this.value)" placeholder="ชื่อเพื่อน">
                <button class="btn btn-danger btn-small" onclick="removePerson('${person.id}')">✕</button>
            `;
            container.appendChild(div);
        });
    }

    function renderItems() {
        const container = document.getElementById('items-container');
        container.innerHTML = '';

        items.forEach((item) => {
            const block = document.createElement('div');
            block.className = 'item-block';

            // ปรับ Layout การกรอกข้อมูลใหม่แบบแถวซ้อนบนล่าง เพื่อให้จอมือถือไม่ล้น
            const mainInputsLayout = document.createElement('div');
            mainInputsLayout.className = 'item-inputs-layout';
            mainInputsLayout.innerHTML = `
                <div class="inputs-row-top">
                    <div class="field-group">
                        <span class="field-label-mini">รายการอาหาร</span>
                        <input type="text" value="${item.name}" oninput="updateItemName('${item.id}', this.value)" placeholder="ชื่ออาหาร">
                    </div>
                    <button class="btn btn-danger btn-small" style="margin-top: 20px; height: 38px;" onclick="removeItem('${item.id}')">✕</button>
                </div>
                <div class="inputs-row-bottom">
                    <div class="field-group">
                        <span class="field-label-mini">จำนวน</span>
                        <input type="number" style="text-align:center;" value="${item.qty}" min="1" oninput="updateItemQty('${item.id}', this.value)">
                    </div>
                    <div class="field-group flex-2">
                        <span class="field-label-mini">ราคา:หน่วย(บาท)</span>
                        <input type="number" style="text-align:right;" value="${item.price}" min="0" oninput="updateItemPrice('${item.id}', this.value)">
                    </div>
                </div>
            `;
            block.appendChild(mainInputsLayout);

            const sharersZone = document.createElement('div');
            sharersZone.className = 'sharers-zone';

            const header = document.createElement('div');
            header.className = 'sharers-header';
            header.innerHTML = `
                <span>⚙️ ใส่ 1 = คิดเต็ม , ใส่ 0.5 = มาหลัง/กินน้อย , ใส่ 0 = ไม่กินไม่หาร</span>
                <div style="display:flex; gap:5px;">
                    <button class="btn-secondary" onclick="presetItemWeights('${item.id}', 1); event.preventDefault();">ทุกคน (=1)</button>
                    <button class="btn-secondary" onclick="presetItemWeights('${item.id}', 0); event.preventDefault();">เคลียร์ (=0)</button>
                </div>
            `;
            sharersZone.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'sharers-grid';

            people.forEach(person => {
                if (item.weights[person.id] === undefined) {
                    item.weights[person.id] = 1;
                }
                const currentWeight = item.weights[person.id];

                const group = document.createElement('div');
                group.className = 'sharer-input-group';
                group.innerHTML = `
                    <span class="sharer-name" title="${person.name}">${person.name || 'ไม่มีชื่อ'}</span>
                    <input type="number" class="input-weight" value="${currentWeight}" min="0" step="0.1" 
                        oninput="updateItemWeight('${item.id}', '${person.id}', this.value)">
                `;
                grid.appendChild(group);
            });

            sharersZone.appendChild(grid);
            block.appendChild(sharersZone);
            container.appendChild(block);
        });
    }

    function addPerson() {
        personCounter++;
        const newId = 'p' + personCounter;
        people.push({ id: newId, name: `นาย ${String.fromCharCode(64 + personCounter)}` });
        
        items.forEach(item => {
            item.weights[newId] = 1;
        });

        renderPeople();
        renderItems();
        calculateBill();
    }

    // ฟังก์ชันอื่นๆ คงความแม่นยำทางระบบคำนวณและแก้อาการปุ่มเอ๋อตามเดิม
    function removePerson(id) {
        if (people.length <= 1) {
            alert('ต้องมีสมาชิกอย่างน้อย 1 คนครับ');
            return;
        }
        people = people.filter(p => p.id !== id);
        items.forEach(item => {
            delete item.weights[id];
        });
        renderPeople();
        renderItems();
        calculateBill();
    }

    function updatePersonName(id, val) {
        const person = people.find(p => p.id === id);
        if (person) {
            person.name = val;
            renderItems();
        }
    }

    function addItem() {
        itemCounter++;
        const newId = 'i' + itemCounter;
        
        let initWeights = {};
        people.forEach(p => {
            initWeights[p.id] = 1;
        });

        items.push({ id: newId, name: `รายการอาหารที่ ${itemCounter}`, qty: 1, price: 0, weights: initWeights });
        renderItems();
        calculateBill();
    }

    function removeItem(id) {
        if (items.length <= 1) {
            alert('ต้องมีอย่างน้อย 1 รายการครับ');
            return;
        }
        items = items.filter(i => i.id !== id);
        renderItems();
        calculateBill();
    }

    function updateItemName(id, val) {
        const item = items.find(i => i.id === id);
        if (item) item.name = val;
    }

    function updateItemQty(id, val) {
        const item = items.find(i => i.id === id);
        if (item) {
            item.qty = parseInt(val) || 1;
            calculateBill();
        }
    }

    function updateItemPrice(id, val) {
        const item = items.find(i => i.id === id);
        if (item) {
            item.price = parseFloat(val) || 0;
            calculateBill();
        }
    }

    function updateItemWeight(itemId, personId, val) {
        const item = items.find(i => i.id === itemId);
        if (item) {
            let w = parseFloat(val);
            if (isNaN(w) || w < 0) w = 0;
            item.weights[personId] = w;
            calculateBill();
        }
    }

    function presetItemWeights(itemId, value) {
        const item = items.find(i => i.id === itemId);
        if (item) {
            people.forEach(p => {
                item.weights[p.id] = value;
            });
            renderItems();
            calculateBill();
        }
    }

    function calculateBill() {
        let subtotal = 0;
        let personItemBreakdown = {};
        people.forEach(p => {
            personItemBreakdown[p.id] = [];
        });

        items.forEach(item => {
            const itemCost = item.qty * item.price;
            subtotal += itemCost;

            let totalWeightInItem = 0;
            people.forEach(p => {
                const w = item.weights[p.id] || 0;
                totalWeightInItem += w;
            });

            people.forEach(p => {
                const w = item.weights[p.id] || 0;
                let rawShare = 0;
                if (totalWeightInItem > 0 && w > 0) {
                    rawShare = (w / totalWeightInItem) * itemCost;
                }
                
                personItemBreakdown[p.id].push({
                    itemName: item.name || 'ไม่ระบุชื่ออาหาร',
                    rawShare: rawShare,
                    weightUsed: w,
                    totalWeight: totalWeightInItem
                });
            });
        });

        const totalDiscount = parseFloat(document.getElementById('bill-discount').value) || 0;
        const svcChargeRate = parseFloat(document.getElementById('bill-service-charge').value) || 0;
        const vatRate = parseFloat(document.getElementById('bill-vat').value) || 0;

        let postDiscountTotal = subtotal - totalDiscount;
        if (postDiscountTotal < 0) postDiscountTotal = 0;

        let totalSvcCharge = postDiscountTotal * (svcChargeRate / 100);
        let postSvcTotal = postDiscountTotal + totalSvcCharge;

        let totalVat = postSvcTotal * (vatRate / 100);
        let grandTotal = postSvcTotal + totalVat;

        let billMultiplier = subtotal > 0 ? (grandTotal / subtotal) : 0;

        document.getElementById('sum-subtotal').innerText = subtotal.toFixed(2);
        document.getElementById('sum-discount').innerText = Math.min(totalDiscount, subtotal).toFixed(2);
        document.getElementById('sum-service').innerText = totalSvcCharge.toFixed(2);
        document.getElementById('sum-vat').innerText = totalVat.toFixed(2);
        document.getElementById('sum-grand-total').innerText = grandTotal.toFixed(2);

        const resultsContainer = document.getElementById('results-container');
        resultsContainer.innerHTML = '';

        people.forEach(person => {
            let finalIndividualPay = 0;
            let detailsHtml = '';

            const myItems = personItemBreakdown[person.id] || [];
            
            myItems.forEach(itemDetail => {
                let finalItemCost = itemDetail.rawShare * billMultiplier;
                finalIndividualPay += finalItemCost;

                if (itemDetail.weightUsed > 0) {
                    detailsHtml += `
                        <div class="detail-item-row">
                            <span class="detail-item-name">🍽️ ${itemDetail.itemName}</span>
                            <span class="detail-item-share">(สัดส่วนหาร ${itemDetail.weightUsed}/${itemDetail.totalWeight})</span>
                            <span class="detail-item-price">${finalItemCost.toFixed(2)} บาท</span>
                        </div>
                    `;
                }
            });

            if (detailsHtml === '') {
                detailsHtml = `<div class="detail-item-row" style="color:var(--text-muted); font-size:0.8rem;">ไม่มีรายการอาหารที่ร่วมหาร</div>`;
            }

            const personBlock = document.createElement('div');
            personBlock.className = 'result-person-block';
            personBlock.innerHTML = `
                <div class="result-person-header">
                    <span>👤 ${person.name || 'ไม่มีชื่อ'}</span>
                    <span class="result-person-total">${finalIndividualPay.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})} บาท</span>
                </div>
                <div class="result-person-details">
                    ${detailsHtml}
                </div>
            `;
            resultsContainer.appendChild(personBlock);
        });
    }
</script>

</body>
</html>
